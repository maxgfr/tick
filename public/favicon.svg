<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    tick: the instrument's window, two cells wide, mid-count.

    The left cell is flooded by the safelight — live. The right cell is the
    dark recess with one luminous figure standing in it, the one thing the
    lamp does not reach. Rank is inversion, in a mark small enough to read at
    16px: shapes only, never text.
  -->
  <rect width="512" height="512" rx="112" fill="#120b0c"/>

  <!-- Live: the cell the lamp floods. -->
  <rect x="88" y="128" width="152" height="256" rx="16" fill="#e0402a"/>
  <!-- Its figure goes dark inside the flood. -->
  <rect x="146" y="184" width="36" height="144" rx="8" fill="#1a0708"/>

  <!-- Waiting: the dark recess, its top edge catching the light. -->
  <rect x="272" y="128" width="152" height="256" rx="16" fill="#0c0708"/>
  <rect x="272" y="128" width="152" height="7" rx="3.5" fill="#ffffff" opacity="0.16"/>
  <!-- The luminous figure. -->
  <rect x="330" y="184" width="36" height="144" rx="8" fill="#e9e7d3"/>
</svg>
