<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>tick — local-first timers</title>
    <meta
      name="description"
      content="Countdowns, stopwatch, intervals, metronome, world clock, duration calculator, alarms and a fullscreen display. Everything runs in your browser — no account, no server, no tracking."
    />

    <link rel="icon" type="image/svg+xml" href="/tick/favicon.svg" />
    <link rel="apple-touch-icon" href="/tick/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#161412" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- No crawler tricks, no preview, no third party. The app is for one person: whoever holds the device. -->
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <!--
      THESIS: a timer is a promise to a future moment; the app keeps it to the
      second, then gets out of the way. Refuses the gradient-ring focus app and
      the white clock-app clone.
      OWN-WORLD: warm-black instrument ground (warm paper in daylight), one
      amber signal for whatever runs, Spline Sans Mono tabular numerals,
      stopwatch-bezel tick rulers, dial rings with ticked bezels.
      STORY: the visitor reads their time from across the room, believes it
      after a reload (the timestamp math holds), and starts or pauses with one
      thumb.
      FIRST VIEWPORT: the tool grid — small "tick" wordmark, eight quiet cards,
      mono key numerals; whatever runs surfaces live, in amber.
      FORM: Operate instrument panel, first of its family (bezel instrument
      over split-flap or chronograph costume); inherited house world.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <noscript>
      tick runs entirely in your browser, so it needs JavaScript. Nothing is sent anywhere —
      enabling it does not expose you to any server.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
