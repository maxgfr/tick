<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>tick — local-first timers</title>
    <meta
      name="description"
      content="Countdowns, stopwatch, intervals, metronome, world clock, cross-timezone meeting planner, duration calculator, alarms and a fullscreen display. Everything runs in your browser — no account, no server, no tracking."
    />

    <!-- Relative, deliberately: Vite prefixes the base onto a leading-slash
         href in dev but not in the build, so an absolute path is doubled on
         the dev server. The page always sits at the base, so this resolves
         correctly in both. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#120b0c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#efe9e2" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- No crawler tricks, no preview, no third party. The app is for one person: whoever holds the device. -->
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <!--
      THESIS: the one timer built to be read in the dark, by someone whose
      hands are busy. Refuses the gradient-ring focus app and the white
      clock-app clone alike — and the departure board it used to be.
      OWN-WORLD: a darkroom enlarger timer under a safelight. The lamp touches
      every surface, line and label — the ground is red-biased near-black, not
      neutral grey with an accent on top — and the luminous figures are the
      only thing it does not reach. The readout window stays dark in both
      themes: it is the instrument, not a preference. Light theme is the same
      room with the lights up: bleached enamel, red gone to ink. Rank is
      inversion, one label schema, one constant label scale.
      STORY: the visitor lands straight on their countdowns, reads the figure
      from across the room in bad light, believes it after a reload (the
      timestamp math holds), and starts or pauses with one thumb.
      FIRST VIEWPORT: the countdown deck — the tool rail down the left on a
      desk, the thumb bar at the bottom on a phone; the first timer's figures
      luminous in their cells over a gauge of lit cells; the primary action
      directly under the readout.
      FORM: Operate instrument panel, candidate 1 of the grounded list
      (darkroom timer over broadcast tally, stadium chronometry, mixing desk);
      seed key 1607387e.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
    <div id="root"></div>
    <noscript>
      tick runs entirely in your browser, so it needs JavaScript. Nothing is sent anywhere —
      enabling it does not expose you to any server.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
